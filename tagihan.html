<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayar Tagihan - Bayarin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#004643', light: '#0A6B66', dark: '#003331' },
            aksen: { DEFAULT: '#F5A623', hover: '#E09515' },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-dvh pb-20 antialiased">

  <!-- header -->
  <header class="sticky top-0 z-50 bg-brand text-white">
    <div class="mx-auto max-w-lg flex items-center justify-between px-4 h-[60px]">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-brand-light flex items-center justify-center text-sm font-semibold">Z</div>
        <div class="flex flex-col leading-tight">
          <span class="text-[11px] opacity-75">Selamat datang,</span>
          <span class="text-[15px] font-semibold">Zhaki</span>
        </div>
      </div>
      <button class="relative w-10 h-10 rounded-full flex items-center justify-center text-lg hover:bg-white/10 transition" aria-label="Notifikasi">
        <i class="fa-regular fa-bell"></i>
        <span class="absolute top-2.5 right-2.5 w-[7px] h-[7px] bg-aksen rounded-full border-[1.5px] border-brand"></span>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-4 flex flex-col gap-5 py-4">

    <!-- pilih kategori -->
    <div id="bagian-kategori" class="flex flex-col gap-3">
      <h2 class="text-lg font-semibold">Bayar Tagihan</h2>
      <div class="grid grid-cols-2 gap-3">
        <button data-kat="pln" class="kartu-kategori">
          <div class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center"><i class="fa-solid fa-bolt text-green-700"></i></div>
          <span class="text-sm font-medium">Listrik / PLN</span>
        </button>
        <button data-kat="pdam" class="kartu-kategori">
          <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center"><i class="fa-solid fa-droplet text-blue-700"></i></div>
          <span class="text-sm font-medium">PDAM</span>
        </button>
        <button data-kat="internet" class="kartu-kategori">
          <div class="w-10 h-10 rounded-lg bg-purple-50 flex items-center justify-center"><i class="fa-solid fa-wifi text-purple-700"></i></div>
          <span class="text-sm font-medium">Internet</span>
        </button>
        <button data-kat="seminar" class="kartu-kategori">
          <div class="w-10 h-10 rounded-lg bg-orange-50 flex items-center justify-center"><i class="fa-solid fa-graduation-cap text-orange-700"></i></div>
          <span class="text-sm font-medium">Seminar / Event</span>
        </button>
      </div>
    </div>

    <!-- form cek tagihan -->
    <div id="bagian-form" class="hidden flex flex-col gap-4">
      <button id="tombol-kembali-kat" class="flex items-center gap-1.5 text-sm font-medium text-brand hover:opacity-70 transition self-start">
        <i class="fa-solid fa-chevron-left text-xs"></i> Kembali
      </button>
      <div class="bg-white border border-gray-200 rounded-2xl p-5 flex flex-col gap-4">
        <div class="flex items-center gap-3">
          <div id="ikon-form" class="w-10 h-10 rounded-lg flex items-center justify-center"></div>
          <div>
            <h3 id="judul-form" class="text-base font-semibold"></h3>
            <p id="subjudul-form" class="text-xs text-gray-500"></p>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" id="label-input">Nomor Pelanggan</label>
          <input type="text" id="input-tagihan" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition" placeholder="">
          <p class="text-xs text-red-500 mt-1.5 hidden" id="error-tagihan"></p>
        </div>
        <button id="tombol-cek" class="w-full bg-brand text-white py-3 rounded-lg text-sm font-semibold hover:bg-brand-light active:scale-[0.98] transition">
          Cek Tagihan
        </button>
      </div>
    </div>

    <!-- hasil cek -->
    <div id="bagian-hasil" class="hidden flex flex-col gap-4">
      <button id="tombol-kembali-form" class="flex items-center gap-1.5 text-sm font-medium text-brand hover:opacity-70 transition self-start">
        <i class="fa-solid fa-chevron-left text-xs"></i> Kembali
      </button>

      <div class="bg-white border border-gray-200 rounded-2xl p-5">
        <h3 class="text-base font-semibold mb-4">Detail Tagihan</h3>
        <div id="detail-tagihan" class="flex flex-col gap-3 text-sm"></div>
      </div>

      <div class="bg-white border border-gray-200 rounded-2xl p-5 flex flex-col gap-3">
        <h3 class="text-base font-semibold">Metode Pembayaran</h3>
        <label class="opsi-bayar">
          <input type="radio" name="metode" value="va" class="accent-[#004643]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center"><i class="fa-solid fa-building-columns text-blue-600 text-sm"></i></div>
            <div><span class="text-sm font-medium block">Virtual Account</span><span class="text-xs text-gray-500">Transfer bank (BCA, BNI, Mandiri)</span></div>
          </div>
        </label>
        <label class="opsi-bayar">
          <input type="radio" name="metode" value="qris" class="accent-[#004643]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center"><i class="fa-solid fa-qrcode text-indigo-600 text-sm"></i></div>
            <div><span class="text-sm font-medium block">QRIS</span><span class="text-xs text-gray-500">Scan QR code untuk bayar</span></div>
          </div>
        </label>
        <label class="opsi-bayar">
          <input type="radio" name="metode" value="teller" class="accent-[#004643]">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center"><i class="fa-solid fa-store text-amber-600 text-sm"></i></div>
            <div><span class="text-sm font-medium block">Bayar di Teller / Kasir</span><span class="text-xs text-gray-500">Kode pembayaran + lokasi kantor</span></div>
          </div>
        </label>
        <p class="text-xs text-red-500 hidden" id="error-metode">Pilih metode pembayaran</p>
      </div>

      <button id="tombol-bayar" class="w-full bg-aksen text-gray-900 py-3.5 rounded-lg text-sm font-bold hover:bg-aksen-hover active:scale-[0.98] transition">
        Bayar Sekarang
      </button>
    </div>

    <!-- detail metode bayar -->
    <div id="bagian-detail-metode" class="hidden flex flex-col gap-4">
      <button id="tombol-kembali-hasil" class="flex items-center gap-1.5 text-sm font-medium text-brand hover:opacity-70 transition self-start">
        <i class="fa-solid fa-chevron-left text-xs"></i> Kembali
      </button>
      <div id="isi-detail-metode" class="bg-white border border-gray-200 rounded-2xl p-5 flex flex-col items-center gap-4"></div>
      <button id="tombol-konfirmasi" class="w-full bg-aksen text-gray-900 py-3.5 rounded-lg text-sm font-bold hover:bg-aksen-hover active:scale-[0.98] transition">
        Konfirmasi Pembayaran
      </button>
    </div>

    <!-- loading -->
    <div id="bagian-loading" class="hidden flex flex-col items-center justify-center gap-4 py-16">
      <div class="spinner"></div>
      <p class="text-sm font-medium text-gray-600">Memproses pembayaran...</p>
    </div>

    <!-- sukses -->
    <div id="bagian-sukses" class="hidden flex flex-col items-center gap-4 py-8">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center">
        <i class="fa-solid fa-check text-2xl text-green-600"></i>
      </div>
      <h3 class="text-lg font-semibold">Pembayaran Berhasil!</h3>
      <p class="text-sm text-gray-500 text-center">Bukti pembayaran telah disimpan ke riwayat transaksi.</p>
      <div id="kartu-struk" class="w-full bg-white border border-gray-200 rounded-2xl p-5 text-sm"></div>
      <div class="flex gap-3 w-full">
        <button id="tombol-pdf" class="flex-1 border border-brand text-brand py-2.5 rounded-lg text-sm font-semibold hover:bg-brand/5 transition">
          <i class="fa-solid fa-file-pdf mr-1.5"></i> Unduh PDF
        </button>
        <a href="index.html" class="flex-1 bg-brand text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-brand-light transition text-center">
          Selesai
        </a>
      </div>
    </div>
  </main>

  <!-- nav bawah -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex items-center justify-around h-16">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house text-xl"></i><span>Beranda</span></a>
    <a href="tagihan.html" class="nav-item aktif"><i class="fa-solid fa-file-invoice text-xl"></i><span>Tagihan</span></a>
    <a href="spp.html" class="nav-item"><i class="fa-solid fa-building-columns text-xl"></i><span>SPP</span></a>
    <a href="pulsa.html" class="nav-item"><i class="fa-solid fa-mobile-screen text-xl"></i><span>Pulsa</span></a>
    <a href="riwayat.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left text-xl"></i><span>Riwayat</span></a>
  </nav>

  <div id="wadah-toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 items-center"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="tagihan.js"></script>
</body>
</html>
